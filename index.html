<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDHL Game Stats Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS Excel reader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Data Labels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .sticky-col-team { position: sticky; left: 0px; z-index: 20; background-color: #0f172a; }
        .sticky-col-shirt { position: sticky; left: 65px; z-index: 20; background-color: #0f172a; }
        .sticky-col-player { position: sticky; left: 130px; z-index: 20; background-color: #0f172a; box-shadow: 4px 0 6px -2px rgba(0, 0, 0, 0.5); }
        
        thead .sticky-col-team, thead .sticky-col-shirt, thead .sticky-col-player { background-color: #020617; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Top Bar -->
    <header class="bg-red-950 border-b border-red-900 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-black tracking-wider text-white uppercase">SDHL Game Stats</h1>
                <p class="text-xs text-red-300">Player info stays on the left • Click column header to sort table & update graphs</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div id="gameFilterContainer">
                    <label class="block text-[10px] text-red-200 uppercase font-bold">Select View / Game</label>
                    <select id="gameFilter" class="bg-slate-900 border border-red-800 text-white text-sm rounded px-3 py-1.5 focus:outline-none focus:border-white">
                        <option value="all">All Games Total (Season Stats)</option>
                    </select>
                </div>

                <div id="teamFilterContainer">
                    <label class="block text-[10px] text-red-200 uppercase font-bold">Filter Team</label>
                    <select id="teamFilter" class="bg-slate-900 border border-red-800 text-white text-sm rounded px-3 py-1.5 focus:outline-none focus:border-white">
                        <option value="all">All Teams</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] text-red-200 uppercase font-bold">Upload Excels</label>
                    <input type="file" id="excelUpload" multiple accept=".xlsx, .xls, .csv" class="text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-red-900 file:text-white hover:file:bg-red-800 cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Välilehdet (Tabs) -->
        <div class="max-w-7xl mx-auto px-4 flex gap-2 border-t border-red-900/50 pt-2 pb-1 overflow-x-auto">
            <button onclick="switchTab('players')" id="tabPlayers" class="px-4 py-1.5 text-xs font-bold uppercase rounded bg-red-900 text-white transition whitespace-nowrap">Player Stats</button>
            <button onclick="switchTab('compare')" id="tabCompare" class="px-4 py-1.5 text-xs font-bold uppercase rounded bg-slate-900 text-slate-300 hover:bg-slate-800 transition whitespace-nowrap">Player Comparison</button>
            <button onclick="switchTab('faceoffs')" id="tabFaceoffs" class="px-4 py-1.5 text-xs font-bold uppercase rounded bg-slate-900 text-slate-300 hover:bg-slate-800 transition whitespace-nowrap">Faceoffs</button>
            <button onclick="switchTab('teams')" id="tabTeams" class="px-4 py-1.5 text-xs font-bold uppercase rounded bg-slate-900 text-slate-300 hover:bg-slate-800 transition whitespace-nowrap">Team Stats</button>
            <button onclick="switchTab('lines')" id="tabLines" class="px-4 py-1.5 text-xs font-bold uppercase rounded bg-slate-900 text-slate-300 hover:bg-slate-800 transition whitespace-nowrap">Forward Lines</button>
            <button onclick="switchTab('chances')" id="tabChances" class="px-4 py-1.5 text-xs font-bold uppercase rounded bg-slate-900 text-slate-300 hover:bg-slate-800 transition whitespace-nowrap">Scoring Chances</button>
            <button onclick="switchTab('trends')" id="tabTrends" class="px-4 py-1.5 text-xs font-bold uppercase rounded bg-slate-900 text-slate-300 hover:bg-slate-800 transition whitespace-nowrap">Trends & Averages</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-[98%] mx-auto px-2 py-6">

        <!-- Scoring Chances Filters Bar -->
        <div id="chancesFiltersBar" style="display: none;" class="bg-slate-900 border border-slate-800 rounded-lg p-4 mb-4 shadow-xl grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div>
                <label class="block text-[10px] text-red-400 uppercase font-bold mb-1">Select View / Sub-panel</label>
                <div class="flex gap-1 bg-slate-950 p-1 rounded border border-slate-800">
                    <button onclick="switchChancesSub('players')" id="subBtnPlayers" class="flex-1 px-3 py-1 text-[11px] font-bold uppercase rounded bg-red-900 text-white transition">Players</button>
                    <button onclick="switchChancesSub('team')" id="
